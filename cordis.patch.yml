# dsh-usage-dashboard bundle patch: inserts the dual-face plugin row into the
# web profile roster. The node half (exports ".") serves the aggregate endpoints
# from the host process; the `dsh.client` declaration in package.json makes the
# browser half (exports "./client") load in the web GUI.
- insert:
    - id: usage-dashboard
      name: 'dsh-usage-dashboard'
